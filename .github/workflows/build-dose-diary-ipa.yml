name: Build DoseDiary IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/DoseDiary-iOS/**"
      - ".github/workflows/build-dose-diary-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/DoseDiary-iOS

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project DoseDiary.xcodeproj \
            -scheme DoseDiary \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/DoseDiary.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload DoseDiary-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DoseDiary-unsigned-IPA
          path: apps/DoseDiary-iOS/build/DoseDiary-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
