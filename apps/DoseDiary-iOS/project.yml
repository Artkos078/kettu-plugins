name: DoseDiary
options:
  bundleIdPrefix: com.artkos078
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  DoseDiary:
    type: application
    platform: iOS
    sources:
      - DoseDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artkos078.dosediary
        PRODUCT_NAME: DoseDiary
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dose Diary
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID protects your private dose diary.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
